## Cara menjalankan

1. Buka folder project di VS Code.
2. Pastikan extension Live Server sudah terinstall.
3. Klik kanan `index.html` lalu pilih `Open with Live Server`.
4. Browser akan otomatis membuka aplikasi.

## Library yang dipakai

- Font Awesome 6
- Bootstrap 5
- Google Fonts: Inter
- Chart.js
- jQuery + DataTables

## Fitur utama

- Sidebar responsif
- Header dengan search dan shortcut Ctrl + K
- Dark mode / light mode
- Dashboard dengan metric cards dan chart
- CRUD demo mahasiswa, kelas, semester, dosen
- Modal tambah, edit, detail, hapus
- Notifikasi toast
- Ekspor CSV
- localStorage untuk theme dan data demo

## Catatan penting

Project ini adalah frontend demo untuk kebutuhan UI dan interaksi. Data demo disimpan di localStorage. Untuk produksi, hubungkan ke Laravel 12 + MySQL dan API backend.
