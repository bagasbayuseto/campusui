# CampusUI

CampusUI adalah dashboard admin modern untuk sistem informasi akademik kampus. Project ini dibuat dengan HTML5, CSS3, dan JavaScript murni, tanpa framework frontend. Tujuan utama adalah menyediakan template dashboard yang bisa langsung dijalankan dan dikembangkan menjadi aplikasi akademik.

